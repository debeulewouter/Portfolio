<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wouter De Beule · Portfolio</title>

  <!-- De tekst die Google onder je naam toont, en het kaartje dat verschijnt als iemand je link deelt
       (WhatsApp, LinkedIn, iMessage). Het beeld heeft een volledig adres nodig, anders vinden die apps het niet. -->
  <meta name="description" content="Portfolio of Wouter De Beule, a graphic design student based in Antwerp, focused on 3D animation and UI/UX design.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://debeulewouter.com/">
  <meta property="og:title" content="Wouter De Beule · Portfolio">
  <meta property="og:description" content="Graphic design student based in Antwerp, focused on 3D animation and UI/UX design.">
  <meta property="og:image" content="https://debeulewouter.com/images/project-02.jpg">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Het lettertype staat in je eigen map: geen wachten op een andere server -->
  <link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css?v=2026-11-17f">

  <!-- Bewaart de video's op het toestel zodat ze meteen spelen (zie de uitleg bovenaan in js/videos.js).
       Staat hier en niet onderaan: de achtergrond heeft het nodig vóór de pagina getekend wordt. -->
  <script src="js/videos.js?v=2026-11-17"></script>

  <!-- Van de intro naar Work: geen pagina-overgang zoals tussen de andere pagina's (die schuift Work
       in één beweging in beeld). De intro eindigt op een leeg scherm, en Work bouwt zich daarna zelf rustig op. -->
  <style>
    @view-transition {
      navigation: none;
    }
  </style>

  <!-- Je eigen toestel niet meetellen: open één keer debeulewouter.com/?niet-tellen
       (en /?wel-tellen om het terug te draaien). Dit staat vóór Umami, zodat dat bezoek ook niet telt. -->
  <script>
    if (location.search === '?niet-tellen') localStorage.setItem('umami.disabled', '1');
    if (location.search === '?wel-tellen') localStorage.removeItem('umami.disabled');
  </script>

  <!-- Bezoekersstatistieken (Umami, zonder cookies). data-domains: alleen de echte site telt mee, niet je tests. -->
  <script defer src="https://cloud.umami.is/script.js" data-website-id="9738d61e-05c8-4a8d-b611-049cfe5210c3" data-domains="debeulewouter.com"></script>

  <!-- Zonder JavaScript gaat de pagina ook door naar Work -->
  <noscript><meta http-equiv="refresh" content="2;url=work.html"><style>.intro { opacity: 1; }</style></noscript>
</head>
<body>

  <!-- PROEF: bewegende achtergrond. Een kleine, wazige video achter alles (zie .backdrop in css/style.css). -->
  <video class="backdrop" data-src="videos/backdrop.mp4?v=6" autoplay muted loop playsinline disablepictureinpicture aria-hidden="true" tabindex="-1"></video>

  <!-- De achtergrond loopt door van pagina naar pagina. Bij het verlaten bewaart de browser het beeld dat je
       op dat moment zag en de plek in de video. De volgende pagina toont dat beeld meteen (nog voor de video
       geladen is) en laat de video vanaf die plek verder lopen: je ziet geen sprong en geen herstart. -->
  <script>
    (() => {
      const video = document.currentScript.previousElementSibling;

      // Wat de vorige pagina bewaarde: het beeld dat je zag en de plek in de video.
      // Hoort het bij een andere (oudere) achtergrondvideo, dan telt het niet.
      const read = () => {
        try {
          const kept = JSON.parse(sessionStorage.getItem('backdrop'));
          return kept && kept.source === video.dataset.src ? kept : null;
        } catch (error) {
          return null;   // de browser mag niets onthouden (heel strenge privacy): de video begint dan vooraan
        }
      };

      // De video begint op de plek van het bewaarde beeld
      const resume = (saved) => {
        video.currentTime = saved.time;
        // Kent de video zijn lengte nog niet, dan onthoudt niet elke browser die plek: daarom nog eens zodra hij ze kent
        video.addEventListener('loadedmetadata', () => {
          if (Math.abs(video.currentTime - saved.time) > 0.1) video.currentTime = saved.time;
        }, { once: true });
      };

      // 1. Het bewaarde beeld staat er meteen, nog voor de video er is. Het begint even sterk als op de vorige
      //    pagina en gaat in 0,6 s zacht naar de sterkte van deze pagina (Work toont de achtergrond zachter).
      const saved = read();
      if (saved) {
        video.style.backgroundImage = `url(${saved.frame})`;
        video.animate([{ opacity: saved.level, offset: 0 }], { duration: 600, easing: 'ease' });   // offset 0 = het begin
      }

      // 2. De video zelf: van de schijf als hij daar bewaard is (zie js/videos.js), anders van het internet
      const source = video.dataset.src;
      const stored = typeof videoStore === 'undefined' ? Promise.resolve(null) : videoStore.local(source);
      stored.then((local) => {
        video.src = local || source;
        if (saved) resume(saved);
      });

      // 3. Bij het verlaten: bewaar het beeld van dit moment, de plek in de video en hoe sterk hij te zien was
      addEventListener('pagehide', () => {
        if (video.readyState < 2) return;   // nog geen beeld om te bewaren: het vorige blijft gelden
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        try {
          sessionStorage.setItem('backdrop', JSON.stringify({
            source: video.dataset.src,
            time: video.currentTime,
            frame: canvas.toDataURL('image/jpeg', 0.9),
            level: getComputedStyle(video).opacity,
          }));
        } catch (error) {
          // niets bewaard: de volgende pagina begint vooraan
        }
      });

      // Terug met de knop van de browser: die pagina staat er nog zoals je ze verliet, dus ook daar bijwerken
      addEventListener('pageshow', (event) => {
        const latest = event.persisted && read();
        if (latest) {
          video.style.backgroundImage = `url(${latest.frame})`;
          resume(latest);
        }
      });
    })();
  </script>

  <!-- De intro: het woord PORTFOLIO. js/intro.js knipt het in letters, zodat ze één voor één kunnen bewegen.
       De span is het venster waar de letters doorheen schuiven (zie .intro__word in style.css).
       aria-label: een schermlezer leest het woord, niet de losse letters. -->
  <h1 class="intro" aria-label="Portfolio">
    <span class="intro__word" aria-hidden="true">PORTFOLIO</span>
  </h1>

  <script src="js/intro.js?v=2026-11-15e"></script>

</body>
</html>
