<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wouter De Beule · Portfolio</title>

  <!-- De tekst die Google onder je naam toont, en het kaartje dat verschijnt als iemand je link deelt
       (WhatsApp, LinkedIn, iMessage). Het beeld heeft een volledig adres nodig, anders vinden die apps het niet. -->
  <meta name="description" content="Portfolio of Wouter De Beule, a graphic design student based in Antwerp, focused on 3D animation and UI/UX design.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://debeulewouter.com/">
  <meta property="og:title" content="Wouter De Beule · Portfolio">
  <meta property="og:description" content="Graphic design student based in Antwerp, focused on 3D animation and UI/UX design.">
  <meta property="og:image" content="https://debeulewouter.com/images/project-02.jpg">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Het lettertype staat in je eigen map: geen wachten op een andere server -->
  <link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css?v=2026-11-16c">

  <!-- Van de intro naar Work: geen pagina-overgang zoals tussen de andere pagina's (die schuift Work
       in één beweging in beeld). De intro eindigt op een leeg scherm, en Work bouwt zich daarna zelf rustig op. -->
  <style>
    @view-transition {
      navigation: none;
    }
  </style>

  <!-- Je eigen toestel niet meetellen: open één keer debeulewouter.com/?niet-tellen
       (en /?wel-tellen om het terug te draaien). Dit staat vóór Umami, zodat dat bezoek ook niet telt. -->
  <script>
    if (location.search === '?niet-tellen') localStorage.setItem('umami.disabled', '1');
    if (location.search === '?wel-tellen') localStorage.removeItem('umami.disabled');
  </script>

  <!-- Bezoekersstatistieken (Umami, zonder cookies). data-domains: alleen de echte site telt mee, niet je tests. -->
  <script defer src="https://cloud.umami.is/script.js" data-website-id="9738d61e-05c8-4a8d-b611-049cfe5210c3" data-domains="debeulewouter.com"></script>

  <!-- Zonder JavaScript gaat de pagina ook door naar Work -->
  <noscript><meta http-equiv="refresh" content="2;url=work.html"><style>.intro { opacity: 1; }</style></noscript>
</head>
<body>

  <!-- De intro: het woord PORTFOLIO. js/intro.js knipt het in letters, zodat ze één voor één kunnen bewegen.
       De span is het venster waar de letters doorheen schuiven (zie .intro__word in style.css).
       aria-label: een schermlezer leest het woord, niet de losse letters. -->
  <h1 class="intro" aria-label="Portfolio">
    <span class="intro__word" aria-hidden="true">PORTFOLIO</span>
  </h1>

  <script src="js/intro.js?v=2026-11-15e"></script>

</body>
</html>
