<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Me · Wouter</title>

  <!-- Het lettertype staat in je eigen map: geen wachten op een andere server -->
  <link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">

  <!-- Staat je muis op een nav link? Dan haalt de browser die pagina alvast op,
       zodat de overgang meteen start als je klikt (Chrome, alleen via http zoals Live Server) -->
  <script type="speculationrules">
    { "prefetch": [{ "where": { "selector_matches": ".nav a" }, "eagerness": "moderate" }] }
  </script>
</head>
<body>

  <nav class="nav">
    <a href="work.html">WORK</a>
    <a href="me.html" aria-current="page">ME</a>
    <a href="contact.html">CONTACT</a>
  </nav>

  <main class="page">
    <section class="me">

      <!-- Je foto. width en height = de echte maat, zo houdt de browser meteen plaats vrij
           en springt de tekst niet weg terwijl de foto laadt. -->
      <img class="me__photo" src="images/me.jpg" alt="Portrait of Wouter" width="1254" height="1254" fetchpriority="high" decoding="async">

      <div class="me__text">
        <h1 class="me__title">Hi, I’m Wouter.</h1>
        <p class="me__intro">
          Graphic &amp; Digital Media student at AP Antwerp. I make 3D, motion
          and digital design. Always learning, always up for something new.
          Got a project that’s a bit of a challenge? Even better.
        </p>
        <p class="me__info">
          Antwerp, Belgium<br>
          3D · Motion · UI
        </p>
      </div>

    </section>
  </main>

</body>
</html>
