<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Me · Wouter</title>

  <!-- Het lettertype staat in je eigen map: geen wachten op een andere server -->
  <link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css?v=2026-11-05i">

  <!-- Staat je muis op een nav link? Dan haalt de browser die pagina alvast op,
       zodat de overgang meteen start als je klikt (Chrome, alleen via http zoals Live Server) -->
  <script type="speculationrules">
    { "prefetch": [{ "where": { "selector_matches": ".nav a" }, "eagerness": "moderate" }] }
  </script>
</head>
<!-- Lege ontouchstart: zonder dit toont een iPhone het indrukken van een link niet -->
<body ontouchstart="">

  <nav class="nav">
    <a href="work.html">WORK</a>
    <a href="me.html" aria-current="page">ME</a>
    <a href="contact.html">CONTACT</a>
  </nav>

  <main class="page page--me">
    <section class="me">

      <!-- Je foto. width en height = de echte maat, zo houdt de browser meteen plaats vrij
           en springt de tekst niet weg terwijl de foto laadt. -->
      <img class="me__photo" src="images/me.jpg" alt="Portrait of Wouter" width="1254" height="1254" fetchpriority="high" decoding="async">

      <div class="me__text">
        <h1 class="me__title">Hi, I’m Wouter.</h1>
        <p class="me__intro">
          I’m a graphic design student focused on 3D&nbsp;animation and UI/UX&nbsp;design,
          but branding projects don’t scare me off either. Outside of design
          I’m really into tech and fashion, and I’m always curious about new things.
        </p>
      </div>

    </section>
  </main>

</body>
</html>
